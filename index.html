<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frontend Mentor | QR code component</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <article class="card">
            <img class="qr-code" src="images/image-qr-code.png" alt="QR code to visit Frontend Mentor">
            <div class="text-wrapper">
                <h1 class="card-title">Improve your front-end skills by building projects</h1>
                <p class="card-text">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p></div>
        </article>
    </main>
</body>
</html>
